pluginManagement {
    def expoAutolinkingPackageJson = new File(
        providers.exec {
            workingDir(rootDir)
            commandLine("node", "--print", "require.resolve('expo-modules-autolinking/package.json')")
        }.standardOutput.asText.get().trim()
    )
    includeBuild(new File(expoAutolinkingPackageJson.getParentFile(), "android"))

    def reactNativeGradlePlugin = new File(
        providers.exec {
            workingDir(rootDir)
            commandLine("node", "--print", "require.resolve('@react-native/gradle-plugin/package.json', { paths: [require.resolve('react-native/package.json')] })")
        }.standardOutput.asText.get().trim()
    ).getParentFile().absolutePath

    includeBuild(reactNativeGradlePlugin)
}

plugins {
    id("com.facebook.react.settings")
    id("expo-autolinking-settings")
}

extensions.configure(expo.modules.autolinking.settings.ExpoAutolinkingSettingsExtension) { ex ->
    ex.useExpoModules()
}

extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
    ex.autolinkLibrariesFromCommand()
}

rootProject.name = 'Zerra Food Hub'

include ':app'
