// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  ext {
    buildToolsVersion = "35.0.0"
    minSdkVersion = 24
    compileSdkVersion = 35
    targetSdkVersion = 34
    ndkVersion = "26.1.10909125"
    kotlinVersion = "1.9.25"
    kspVersion = "1.9.25-1.0.20"
  }
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion")
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
  configurations.all {
    resolutionStrategy {
      force "androidx.core:core:1.15.0"
      force "androidx.core:core-ktx:1.15.0"
    }
  }

  afterEvaluate { project ->
    if (project.name == 'app') {
      project.tasks.matching { it.name.startsWith("check") && it.name.endsWith("AarMetadata") }.configureEach {
        dependsOn(rootProject.subprojects.collect { sub ->
          sub.tasks.matching { t -> t.name.startsWith("write") && t.name.endsWith("AarMetadata") }
        })
      }
    }
  }
}
