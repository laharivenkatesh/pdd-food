name: All Test Suites & Excel Reports Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-all-test-reports:
    name: Run All Test Generators & Bundle Excel Reports
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Load Test Dependencies & Run Generator
        run: |
          cd "Load tests"
          npm install
          node generate_excel_report.js

      - name: Install Selenium Test Dependencies & Run Generator
        run: |
          cd "Selenium reports"
          npm install
          node generate_excel_report.js

      - name: Install Vulnerability Test Dependencies & Run Generator
        run: |
          cd "vulnerability tests"
          npm install
          node generate_vulnerability_excel.js

      - name: Install Appium Test Dependencies & Run Generator
        run: |
          cd "appium tests"
          npm install
          node generate_excel_report.js

      - name: Upload All Excel Reports as Single Artifact
        uses: actions/upload-artifact@v4
        with:
          name: All_PDD_Food_Excel_Test_Reports
          path: |
            Load tests/Load_tests_report.xlsx
            Selenium reports/Selenium_report.xlsx
            vulnerability tests/Vulnerability_report.xlsx
            appium tests/Appium_report.xlsx
          retention-days: 30

      - name: Write GitHub Actions Comprehensive Summary
        run: |
          echo "# 🚀 PDD Food All Test Reports Bundle" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All automated test report generators executed successfully during this workflow run." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Generated Reports & Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "| Test Suite | Report File | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **1. Load Testing** | \`Load_tests_report.xlsx\` | ✅ Generated |" >> $GITHUB_STEP_SUMMARY
          echo "| **2. Selenium E2E Tests** | \`Selenium_report.xlsx\` | ✅ Generated |" >> $GITHUB_STEP_SUMMARY
          echo "| **3. Vulnerability Audit** | \`Vulnerability_report.xlsx\` | ✅ Generated |" >> $GITHUB_STEP_SUMMARY
          echo "| **4. Appium Mobile E2E** | \`Appium_report.xlsx\` | ✅ Generated |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📥 **Artifact Bundle**: Download **All_PDD_Food_Excel_Test_Reports** from the Action Run Artifacts section." >> $GITHUB_STEP_SUMMARY
